<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cloudy ☁️</title>
<style>
:root{
  --bg0:#dde6ef;
  --bg1:#edf2f7;
  --card:#ffffffcc;
  --border:#c8d8e8;
  --text:#2c3e50;
  --dim:#7a95ad;
  --accent:#5b9ec9;
  --ok:#5aaa7a;
  --err:#c05a5a;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  background:linear-gradient(145deg,var(--bg0) 0%,var(--bg1) 100%);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1.5rem 1rem 2rem;
  gap:1rem;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 2px 12px #9ab5cc22;
}
/* ── Header ── */
header{
  width:100%;
  max-width:860px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1rem 1.4rem;
}
#clock{
  font-size:clamp(2rem,7vw,3.4rem);
  font-weight:700;
  letter-spacing:.03em;
  line-height:1;
  color:var(--text);
}
#date{font-size:.78rem;color:var(--dim);margin-top:.25rem;text-transform:capitalize}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* ── Metrics grid ── */
.grid{
  width:100%;
  max-width:860px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:.85rem;
}
.metric{padding:1.3rem 1.2rem 1.1rem;display:flex;flex-direction:column;gap:.45rem}
.metric .lbl{
  font-size:.68rem;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--dim);
}
.metric .val{
  font-size:2.2rem;
  font-weight:700;
  line-height:1;
  color:var(--text);
}
.metric .unit{font-size:.8rem;font-weight:400;color:var(--dim)}
.metric .sub{font-size:.73rem;color:var(--dim)}

/* AQI bar */
.bar-track{margin-top:.35rem;height:4px;border-radius:2px;background:linear-gradient(90deg,#5aaa7a,#e0c45a,#c87a3a,#c05a5a);position:relative;opacity:.75}
.bar-needle{position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--accent);transform:translateX(-50%);transition:left .5s ease}
/* TVOC bar */
.tvoc-track{margin-top:.35rem;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.tvoc-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),#9b7fd4);transition:width .5s ease}

/* ── Status bar ── */
.status-bar{
  width:100%;
  max-width:860px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.8rem 1.4rem;
  gap:.8rem;
  flex-wrap:wrap;
}
.ts-left{display:flex;align-items:center;gap:.65rem}
.ts-icon{font-size:1.6rem;line-height:1}
.ts-name{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.ts-hint{font-size:.65rem;color:var(--dim);margin-top:.1rem}
.pill{
  display:flex;align-items:center;gap:.45rem;
  font-size:.75rem;font-weight:500;
  padding:.3rem .85rem;
  border-radius:999px;
  border:1px solid var(--border);
  background:#fff8;
  transition:color .3s;
}
.pill .pd{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s,box-shadow .3s}
.pill.ok{color:var(--ok)}.pill.ok .pd{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.pill.error{color:var(--err)}.pill.error .pd{background:var(--err);box-shadow:0 0 7px var(--err)}
.pill.sending{color:var(--accent)}.pill.sending .pd{background:var(--accent);box-shadow:0 0 7px var(--accent);animation:pulse 1s ease-in-out infinite}
.pill.idle{color:var(--dim)}.pill.idle .pd{background:var(--dim)}
.ts-meta{font-size:.68rem;color:var(--dim);text-align:right;line-height:1.7}
.ts-meta b{color:var(--text);font-weight:500}

footer{font-size:.68rem;color:var(--dim);letter-spacing:.05em}
</style>
</head>
<body>

<header class="card">
  <div id="clock">--:--:--</div>
  <div id="date">Chargement…</div>
</header>

<div class="grid">
  <div class="metric card">
    <div class="lbl">Température</div>
    <div class="val"><span id="tempValue">--</span><span class="unit"> °C</span></div>
    <div class="sub">Rosée : <span id="dewPoint">--</span> °C</div>
  </div>
  <div class="metric card">
    <div class="lbl">Humidité</div>
    <div class="val"><span id="humidityValue">--</span><span class="unit"> %</span></div>
    <div class="sub">eCO₂ : <span id="eco2Value">--</span> ppm</div>
  </div>
  <div class="metric card">
    <div class="lbl">Qualité de l'air</div>
    <div class="val"><span id="aqiValue">--</span><span class="unit"> AQI</span></div>
    <div class="sub" id="aqiLabel">--</div>
    <div class="bar-track"><div class="bar-needle" id="aqiNeedle" style="left:0%"></div></div>
  </div>
  <div class="metric card">
    <div class="lbl">TVOC</div>
    <div class="val"><span id="tvocValue">--</span><span class="unit"> ppb</span></div>
    <div class="sub" id="tvocLabel">--</div>
    <div class="tvoc-track"><div class="tvoc-fill" id="tvocFill" style="width:0%"></div></div>
  </div>
</div>

<div class="status-bar card">
  <div class="ts-left">
    <div class="ts-icon">☁</div>
    <div>
      <div class="ts-name">Station ESP</div>
      <div class="ts-hint">Mise à jour toutes les 15 s</div>
    </div>
  </div>
  <div class="pill idle" id="tsStatus">
    <span class="pd"></span>
    <span id="tsStatusText">En attente</span>
  </div>
  <div class="ts-meta">
    <div>Dernière lecture : <b id="tsLastSend">--:--:--</b></div>
  </div>
</div>

<footer>Mise à jour : <span id="lastUpdate">--</span></footer>

<script>
var POLL=15000,TO=10000;
var S={temp:"--",hum:"--",aqi:0,tvoc:0,eco2:"--",dew:"--"};
var TS={status:"idle",last:null,err:null};
function p(n){return String(n).padStart(2,"0")}
function hms(){var d=new Date();return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
function dew(t,h){
  if(t==null||h==null||t==="--"||h==="--")return"--";
  var a=17.27,b=237.7,x=(a*t)/(b+t)+Math.log(h/100);
  return Math.round((b*x)/(a-x));
}
function aqiInfo(v){
  var t=v<=1?"Bonne":v<=2?"Modérée":v<=3?"Mauvaise":v<=4?"Très mauvaise":"Dangereuse";
  return{text:t,pct:Math.min((v-1)/4,1)};
}
function tvocLabel(v){
  return v<65?"Excellente":v<220?"Bonne":v<660?"Modérée":v<2200?"Mauvaise":"Très mauvaise";
}
function g(id){return document.getElementById(id)}
function render(){
  g("tempValue").textContent=S.temp;
  g("humidityValue").textContent=S.hum;
  g("dewPoint").textContent=S.dew;
  g("eco2Value").textContent=S.eco2;
  var ai=aqiInfo(S.aqi);
  g("aqiValue").textContent=S.aqi==="--"?"--":S.aqi;
  g("aqiLabel").textContent=S.aqi==="--"?"--":ai.text;
  g("aqiNeedle").style.left=S.aqi==="--"?"0%":(ai.pct*100).toFixed(1)+"%";
  var tp=S.tvoc==="--"?0:Math.min(S.tvoc/2200*100,100);
  g("tvocValue").textContent=S.tvoc;
  g("tvocLabel").textContent=S.tvoc==="--"?"--":tvocLabel(S.tvoc);
  g("tvocFill").style.width=tp.toFixed(1)+"%";
  g("lastUpdate").textContent=hms();
}
function renderTs(){
  var el=g("tsStatus");
  el.className="pill "+(TS.status||"idle");
  var lbl={ok:"Données reçues",error:"Échec",sending:"Lecture…",idle:"En attente"};
  g("tsStatusText").textContent=(TS.status==="error"&&TS.err)?TS.err:(lbl[TS.status]||"--");
  g("tsLastSend").textContent=TS.last||"--:--:--";
}
function poll(){
  var c=new AbortController(),tid=setTimeout(function(){c.abort()},TO);
  TS.status="sending";TS.err=null;renderTs();
  fetch("/data",{signal:c.signal})
    .then(function(r){clearTimeout(tid);if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
    .then(function(j){
      S.temp=j.temp!=null?j.temp:"--";
      S.hum=j.hum!=null?j.hum:"--";
      S.aqi=j.aqi!=null?j.aqi:0;
      S.tvoc=j.tvoc!=null?j.tvoc:0;
      S.eco2=j.ec02!=null?j.ec02:"--";
      S.dew=dew(j.temp,j.hum);
      TS.status="ok";TS.last=hms();TS.err=null;
      render();renderTs();
    })
    .catch(function(e){
      clearTimeout(tid);
      TS.status="error";
      TS.err=e.name==="AbortError"?"Timeout 10s":e.message;
      renderTs();
    });
}
function tick(){
  var d=new Date();
  g("clock").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  g("date").textContent=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
render();renderTs();tick();
setInterval(tick,1000);
poll();
setInterval(poll,POLL);
</script>
</body>
</html>
